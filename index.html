<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Battleship</title><script defer="defer" src="/battleship/main.61f6842a134dda145db4.js"></script></head><body><section id="screen-home" class="screen home"><div class="home-background"></div><div class="home-content"><h1 class="home-title">Battleship</h1><p class="home-subtitle">Sink the enemy fleet</p><button id="play-btn" type="button" class="cta-btn">Play</button></div></section><section id="screen-setup" class="screen setup hidden"><header class="setup-header"><h1>Arrange Your Fleet</h1><p class="setup-instructions">Drag ships onto the board and drop them to place. Use <strong>R</strong> or the rotate button to change orientation. Right-click a placed ship to pick it back up.</p></header><div class="setup-layout"><div class="setup-panel"><div id="setup-palette" class="setup-palette"></div><button id="rotate-btn" type="button" class="rotate-btn">Rotate (R)</button> <button id="random-btn" type="button" class="rotate-btn">Random</button> <button id="reset-btn" type="button" class="rotate-btn">Clear</button></div><div class="setup-panel"><div id="setup-board" class="board setup-board"></div></div></div><footer class="setup-footer"><span id="setup-status" class="setup-status"></span> <button id="start-game-btn" type="button" class="cta-btn" disabled="disabled">Start Battle</button></footer></section><section id="screen-game" class="screen game hidden"><header class="app-header"><h1>Battleship</h1><p id="turn-indicator" class="turn-indicator">Their ships are hidden. Fire at will!</p><button id="restart-btn" type="button" class="restart-btn">New Game</button></header><main class="boards"><section class="board-panel"><h2 class="board-title">Your Fleet</h2><div id="human-board" class="board"></div></section><section class="board-panel"><h2 class="board-title">Enemy Waters</h2><div id="computer-board" class="board"></div></section></main><div id="game-over-modal" class="modal hidden"><div class="modal-content"><h2 id="result-title"></h2><p id="result-message"></p><button id="modal-restart-btn" type="button" class="restart-btn">Play Again</button></div></div></section></body></html>
